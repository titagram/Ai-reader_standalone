name: ai_reader
description: Offline PDF/EPUB reader with AI-powered summarization using Gemma 3B
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Local Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2

  # PDF Support
  syncfusion_flutter_pdfviewer: ^24.1.41
  syncfusion_flutter_pdf: ^24.1.41

  # EPUB Support
  epubx: ^4.0.0
  flutter_html: ^3.0.0-beta.2

  # File Operations
  file_picker: ^6.1.1
  share_plus: ^7.2.1
  permission_handler: ^11.1.0

  # FFI for Native Code
  ffi: ^2.1.0

  # HTTP for model download
  dio: ^5.4.0

  # Utilities
  path: ^1.8.3
  uuid: ^4.2.2
  intl: ^0.18.1
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # UI Components
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0

  # Archive handling for EPUB
  archive: ^3.4.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  freezed: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
